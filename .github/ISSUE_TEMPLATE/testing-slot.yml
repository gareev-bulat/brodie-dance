    validations:
      required: true
  - type: input
    id: team
    attributes:
      label: Team name
      placeholder: Team Squat Rack
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent name
      description: The AGENT_NAME from your .env.local, used in `chert dev --agent`
      placeholder: team-yourname-agent
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: Discord handle
      description: So the team before you can ping you when the line is free
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Testing from
      options:
        - In person (JMHH 265)
        - Remote
    validations:
      required: true
