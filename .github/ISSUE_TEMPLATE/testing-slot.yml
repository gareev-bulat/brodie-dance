name: Book a FaceTime testing slot
description: Claim a 15-minute turn on the shared Chert FaceTime line. First come, first served.
title: "[slot] "
labels: ["slot"]
body:
  - type: markdown
    attributes:
      value: |
        See open slots at https://seraphimlabs-dev.github.io/brodie-starter/slots/ . If the slot is already taken, the bot closes this and tells you. Max 2 upcoming slots per team.
  - type: dropdown
    id: slot
    attributes:
      label: Slot
      options:
        - "Sat Oct 10 · 7:00 PM ET"
        - "Sat Oct 10 · 7:15 PM ET"
        - "Sat Oct 10 · 7:30 PM ET"
        - "Sat Oct 10 · 7:45 PM ET"
        - "Sat Oct 10 · 8:00 PM ET"
